<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #eaeaea;
        }

        .navbar {
            height: 64px;
            margin: 16px 6px;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #3d4656;
            color: white;
        }

        .brand {
            color: white;
            font-size: 25px;
            font-weight: 700;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 34px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .nav-links a {
            color: white;
            font-weight: 700;
            text-decoration: none;
        }

        .menu-toggle,
        .hamburger {
            display: none;
        }

        .breakpoint-message {
            margin: 64px 6px 16px;
            padding: 7px 0;
            background-color: #3d4656;
            color: white;
        }

        @media (max-width: 768px) {
            .navbar {
                height: 64px;
            }

            .nav-links {
                display: none;
                position: absolute;
                top: 80px;
                left: 6px;
                right: 6px;
                flex-direction: column;
                align-items: flex-start;
                gap: 0;
                background-color: #3d4656;
            }

            .nav-links li {
                width: 100%;
            }

            .nav-links a {
                display: block;
                padding: 16px 24px;
            }

            .hamburger {
                display: block;
                width: 22px;
                cursor: pointer;
            }

            .hamburger span,
            .hamburger span::before,
            .hamburger span::after {
                display: block;
                width: 22px;
                height: 3px;
                background-color: white;
            }

            .hamburger span {
                position: relative;
            }

            .hamburger span::before,
            .hamburger span::after {
                content: "";
                position: absolute;
                left: 0;
            }

            .hamburger span::before {
                top: -7px;
            }

            .hamburger span::after {
                top: 7px;
            }

            .menu-toggle:checked ~ .nav-links {
                display: flex;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a class="brand" href="#">Logo</a>

        <input class="menu-toggle" type="checkbox" id="menu-toggle">
        <label class="hamburger" for="menu-toggle" aria-label="Toggle navigation">
            <span></span>
        </label>

        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    
</html>
